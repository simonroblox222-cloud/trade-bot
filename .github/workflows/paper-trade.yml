name: paper-trade
# Daily strategies decide on yesterday's close and send orders before the open.
# GitHub often starts scheduled runs late, so run early and again as a backup.
# A second run the same morning is harmless: the bot skips symbols it already holds or has orders for.
on:
  schedule:
    - cron: "30 11 * * 1-5"
    - cron: "45 12 * * 1-5"
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python main.py run-once --strategy rsi2
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          ALPACA_PAPER: "true"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: logs-${{ github.run_id }}
          path: logs/
